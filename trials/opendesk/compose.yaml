services:
  database:
    image: pgvector/pgvector:pg17@sha256:b513c48566e4777cd3370451400000c78eda6a08131d68f4c31d4a76f27bd8fd
    user: "postgres"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    mem_limit: 1g
    pids_limit: 256
    environment:
      POSTGRES_USER: opendesk
      POSTGRES_DB: opendesk
      POSTGRES_PASSWORD: ${TRIAL_DATABASE_PASSWORD:?generated by run.py}
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "opendesk", "-d", "opendesk"]
      interval: 2s
      timeout: 2s
      retries: 45
    tmpfs:
      - /var/lib/postgresql/data:uid=999,gid=999,mode=0700
      - /var/run/postgresql:uid=999,gid=999,mode=0755
      - /tmp:mode=1777

  model:
    image: python:3.12.16-slim@sha256:5e2bdb1b0d542d5039cffb8181c65930093949194a65c365dfb1b0fe13a4fa5b
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 64
    command: ["python", "-B", "/stub/provider.py"]
    user: "65534:65534"
    read_only: true
    volumes:
      - ./provider.py:/stub/provider.py:ro
      - ./transport.py:/stub/transport.py:ro

  app:
    image: ghcr.io/useopendesk/opendesk:v0.4.13@sha256:e0fca3427eec675426c6c96766267d7980c861b52f630afc906fcf0c7dca0fe1
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    mem_limit: 1g
    pids_limit: 256
    environment:
      OPENDESK_ROLE: all
      OPENDESK_ENV: development
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://opendesk:${TRIAL_DATABASE_PASSWORD:?generated by run.py}@database:5432/opendesk?sslmode=disable
      AUTH_SECRET: ${TRIAL_AUTH_SECRET:?generated by run.py}
      CREDENTIALS_KEY: ${TRIAL_CREDENTIALS_KEY:?generated by run.py}
      NATS_TOKEN: ${TRIAL_NATS_TOKEN:?generated by run.py}
      DATA_DIR: /data
      MAIL_DRIVER: log
      UPDATE_CHECK: "false"
      AI_PROVIDER: openai
      OPENAI_API_KEY: ${TRIAL_MODEL_KEY:?generated by run.py}
      OPENAI_BASE_URL: http://model:8000/v1
      AI_MODEL: axiom-fixture
      AI_FAST_MODEL: axiom-fixture
    depends_on:
      database:
        condition: service_healthy
      model:
        condition: service_started

networks:
  default:
    internal: true
